[package]
name = "guppty"
version = "0.2.0"
edition = "2021"
rust-version = "1.82"
description = "The Guppty programming language"
license = "MIT"

[[bin]]
name = "guppty"
path = "src/main.rs"

[[bench]]
name = "benchmark_suite"
path = "benches/runner.rs"
harness = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
toml = "0.8.23"
